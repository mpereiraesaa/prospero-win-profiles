name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: the benchmark sources are still downloadable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check profiles, presets and profiles.lst
        run: python3 tools/check_profiles.py
      - name: Checker tests
        run: python3 -m unittest -v tests/test_check_profiles.py
      - name: Shellcheck the benchmark and plugin builds
        run: shellcheck benchmarks/build.sh plugins/sa-shadow-edges/build.sh

  benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the MinGW compilers and p7zip
        run: sudo apt-get update -q && sudo apt-get install -yq gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 p7zip-full
      - name: Build the benchmark programs
        run: benchmarks/build.sh out
      - name: San Andreas shadow-edge plugin (index tests, plugin build)
        run: python3 -m unittest -v tests/test_sa_shadow_edges.py
      - name: Check what was built
        run: |
          for f in 7za.exe 7za-x64.exe 7za-License.txt nb-x87.exe nb-x64.exe NNET.DAT COM.DAT \
                   pi-x87.exe pi-x64.exe; do
            test -s "out/$f" || { echo "missing out/$f"; exit 1; }
          done
          for f in nb-x87.exe pi-x87.exe; do
            file "out/$f" | grep -q "PE32 executable.*Intel 80386" || { file "out/$f"; exit 1; }
          done
          for f in nb-x64.exe pi-x64.exe 7za-x64.exe; do
            file "out/$f" | grep -q "PE32+ executable.*x86-64" || { file "out/$f"; exit 1; }
          done
