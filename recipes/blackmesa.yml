# Black Mesa (Definitive Edition, 2020-era Source engine), the Half-Life 1
# remake, for Prospero Win, in Lutris's installer format. Completes the
# Source set on the console: Half-Life 2, its episodes, Lost Coast and Portal.
#
# There is no installer to run: give the recipe an installed Black Mesa
# folder (the one holding bms.exe, bin/, bms/, hl2/ and platform/). It is
# copied into C:\Games\BlackMesa of a prefix of its own. bms.exe is a 32-bit
# (PE32, large-address-aware) Direct3D 9 program; it runs through DXVK 2.6.2
# like Half-Life 2 (same engine family, same tested settings: no dxvk.conf).
#
# The game refuses to start without Steam ("Steam is not running"). This
# copy's bin/steam_api.dll is Valve's own; it expects a Steam client, which
# the copy's "cold client" loader (steamclient_loader_x32.exe,
# ColdClientLoader.ini) fakes by starting bms.exe as a second process with
# an emulated steamclient.dll injected. The console runs one process, so
# instead bin/steam_api.dll is replaced by the Goldberg emulator's regular
# build (gbe_fork, release 2026-09-27, 32-bit), which needs no client: it
# reads bin/steam_settings (a copy of the release's steam_settings:
# language=spanish, offline account), bin/steam_appid.txt (362890, already
# there) and bin/steam_interfaces.txt (the interface versions Valve's
# steam_api.dll of this copy asks for, listed from its strings). Tested on
# the PC with the pinned Wine: the menu comes up in Spanish. The loader's
# files stay in place, unused.
#
# The 2020 main menu is a Qt 5.9 QML scene (bin/BlackMesaUI.dll) drawn
# through ANGLE and handed to the game as a Direct3D shared texture. On the
# console DXVK cannot create it (RADV has no VK_KHR_external_memory_win32),
# so the menu's background shows and nothing else. -oldgameui selects the
# engine's classic VGUI menu (same options, Spanish), which draws like the
# rest of the HUD; Qt is then never loaded.
#
# The game loads its own DXVK (bin/thirdparty/dxvk-windows-x86/d3d9.dll,
# 2.6.1) for Direct3D 9 unless started with -disabledxvk; the prefix's DXVK
# 2.6.2 stays for the dll_overrides. Both work on the console.
#
# The DualSense reaches the engine as an XInput pad. Saves go to bms/SAVE
# inside the prefix.
name: "Black Mesa"
game_slug: blackmesa
version: Definitive Edition (Prospero Win)
slug: blackmesa-prospero-win
runner: wine
prospero:
  name: Black Mesa
  graphics: dxvk
  display: {desktop: 1920x1080}
  input: {mode: xinput}
script:
  game:
    exe: drive_c/Games/BlackMesa/bms.exe
    args: -oldgameui -novid -fullscreen -w 1920 -h 1080
    prefix: $GAMEDIR
  files:
  - game: "N/A:Select the installed Black Mesa folder (it holds bms.exe, bin and bms)"
  - gbe:
      url: https://github.com/Detanup01/gbe_fork/releases/download/release-2026_09_27/emu-win-release-vs22.7z
      filename: gbe_fork-emu-win-release-vs22-2026_09_27.7z
      sha256: 300186c34f49a9ea75b33ce2af299267cc1dad0225cf45e81a229578d4e11c85
  wine:
    dxvk: true
    dxvk_version: "2.6.2"
  installer:
  - task: {name: create_prefix, prefix: $GAMEDIR, arch: win32}
  - copy: {src: game, dst: $GAMEDIR/drive_c/Games/BlackMesa}
  - extract: {file: gbe, dst: $CACHE/gbe}
  - move: {src: $CACHE/gbe/release/regular/x86/steam_api.dll, dst: $GAMEDIR/drive_c/Games/BlackMesa/bin/steam_api.dll}
  - copy: {src: $GAMEDIR/drive_c/Games/BlackMesa/steam_settings, dst: $GAMEDIR/drive_c/Games/BlackMesa/bin/steam_settings}
  - write_file:
      file: $GAMEDIR/drive_c/Games/BlackMesa/bin/steam_interfaces.txt
      content: |
        SteamClient017
        SteamClient020
        SteamGameServer014
        SteamGameServerStats001
        SteamUser021
        SteamFriends017
        SteamUtils010
        SteamMatchMaking009
        SteamMatchMakingServers002
        STEAMUSERSTATS_INTERFACE_VERSION012
        STEAMAPPS_INTERFACE_VERSION008
        SteamNetworking006
        STEAMREMOTESTORAGE_INTERFACE_VERSION016
        STEAMSCREENSHOTS_INTERFACE_VERSION003
        STEAMHTTP_INTERFACE_VERSION003
        STEAMUGC_INTERFACE_VERSION015
        STEAMAPPLIST_INTERFACE_VERSION001
        STEAMMUSIC_INTERFACE_VERSION001
        STEAMMUSICREMOTE_INTERFACE_VERSION001
        STEAMHTMLSURFACE_INTERFACE_VERSION_005
        STEAMINVENTORY_INTERFACE_V003
        SteamController008
        STEAMVIDEO_INTERFACE_V002
        SteamInput005
        STEAMPARENTALSETTINGS_INTERFACE_VERSION001
        SteamNetworkingSockets011
        SteamNetworkingUtils004
        SteamNetworkingMessages002
        STEAMREMOTEPLAY_INTERFACE_VERSION001
