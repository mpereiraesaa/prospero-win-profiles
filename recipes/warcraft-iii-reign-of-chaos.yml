# Warcraft III: Reign of Chaos 1.27a for Prospero Win, in Lutris's installer
# format. Adapted from the lutris.net "Digital 1.27" script: the same
# Blizzard installer (your own copy; it asks for your CD key in its window,
# and shows its license in an Internet Explorer control, hence Gecko), but
# Direct3D 9 (1.27a's renderer) through DXVK instead of -opengl, since the
# console has no OpenGL.
name: "Warcraft III: Reign of Chaos"
game_slug: warcraft-iii-reign-of-chaos
version: Installer 1.27a (Prospero Win)
slug: warcraft-iii-reign-of-chaos-prospero-win
runner: wine
prospero:
  name: Warcraft III
  display: {desktop: 1920x1080, scaling: fit}
  input: {preset: warcraft3}
script:
  game:
    # War3.exe itself: "Warcraft III.exe" only starts it as a second process,
    # which Wine on the console does not do.
    exe: drive_c/Program Files (x86)/Warcraft III/War3.exe
    prefix: $GAMEDIR
  files:
  - installer: "N/A:Select Installer.exe in your Warcraft III Reign of Chaos 1.27a installer folder"
  # ENAleksey's RenderEdge_Widescreen (1.23a-1.28.5): 1.27a's 3D view is
  # 4:3 stretched to the screen without it. The game loads .mix files from
  # its folder as plugins. No licence, so it is downloaded, not shipped, and
  # pinned to the release's bytes.
  - renderedge:
      url: https://github.com/ENAleksey/RenderEdge_Widescreen/releases/download/v1.2.0c/RenderEdge_Widescreen.mix
      filename: RenderEdge_Widescreen.mix
      sha256: 2b3b5b0a1006f1793676243b712527ba443dada9ac5c8c9722d3bb73e859cda6
  wine:
    dxvk: true
    dxvk_version: "2.6.2"
  installer:
  - task: {name: create_prefix, prefix: $GAMEDIR, arch: win32, install_gecko: true}
  - task:
      name: wineexec
      executable: installer
      prefix: $GAMEDIR
      return_code: "0,25856"
      description: "Follow the installer: enter your CD key, keep the default folder, and close it when it finishes."
  # The cinematics' DirectShow decoder: black videos without it. 32-bit, so
  # the 32-bit regsvr32.
  - task:
      name: wineexec
      executable: drive_c/windows/syswow64/regsvr32.exe
      args: /s "C:\\Program Files (x86)\\Warcraft III\\blizzard.ax"
      prefix: $GAMEDIR
  # The movies' AVI splitter and decoders. Wine's own splitters are
  # GStreamer's, which the console's Wine is built without; LAV Filters are
  # Windows DirectShow filters and run there like the game. Measured on the
  # PC with GStreamer disabled: the intro plays, picture and sound.
  - task: {name: winetricks, app: lavfilters, prefix: $GAMEDIR}
  - copy: {src: renderedge, dst: "$GAMEDIR/drive_c/Program Files (x86)/Warcraft III"}
  # The console's desktop size (prospero.display), not the PC's: the
  # swapchain has to be a size VideoOut accepts (1440x1080 is refused), and
  # RenderEdge makes 16:9 right. The 800x600 cinematics are scaled and centred.
  - task:
      name: set_regedit
      path: HKEY_CURRENT_USER\Software\Blizzard Entertainment\Warcraft III\Video
      key: reswidth
      value: 1920
      type: REG_DWORD
  - task:
      name: set_regedit
      path: HKEY_CURRENT_USER\Software\Blizzard Entertainment\Warcraft III\Video
      key: resheight
      value: 1080
      type: REG_DWORD
