# Grand Theft Auto: San Andreas (PC version 1.0) for Prospero Win, in
# Lutris's installer format. Tested on the PS5: 60 fps at 1920x1080 with the
# DualSense (see profiles/gta-san-andreas.profile), on a prospero-win runtime
# with #373 and #374; CLEO and Mod Loader also need #380, #382 and #385, and
# Proper Shaders #387.
#
# There is no installer to run: the game comes from your own installed copy.
# Give the recipe the folder that holds gta_sa.exe; it is copied into
# C:\Games\GTASA of a prefix of its own. It has to be version 1.0 (the mods
# below need it): gta_sa.exe 1.0 is 14,383,616 bytes. The Steam and Rockstar
# Games Launcher releases are newer and need downgrading first.
#
# Mods, all loaded as plugins from the game's scripts folder:
# - GInput: San Andreas reads gamepads only through DirectInput, which the
#   DualSense doesn't appear as on the console. GInput replaces the game's pad
#   code with XInput, which it does, and adds rumble and PlayStation button
#   prompts.
# - SilentPatch fixes many of the game's own bugs, among them the ones that
#   show above 30 fps.
# - The Widescreen Fix draws the HUD, menus and camera for 16:9, and starts
#   the game at the desktop's resolution (the console's 1920x1080) instead of
#   800x600, so there is no resolution to pick.
# - Framerate Vigilante fixes what still breaks above 30 fps (driving,
#   swimming, helicopters, some missions) and holds the game at 60. Its only
#   download is on MixMods (mixmods.com.br, "Framerate Vigilante"), behind a
#   browser check, so download Framerate_Vigilante.zip there and give it to
#   the recipe. It wants the game's own frame limiter left on (the default).
# - The Widescreen Frontend replaces the loading screens (models/txd/
#   LOADSCS.txd) with 16:9 ones.
# - The Open Limit Adjuster raises the game's object and streaming limits,
#   which larger mods need. Three of its limits are arrays the game walks
#   every frame, so the recipe sets them to what mods use rather than the
#   ini's very large defaults: Coronas 1000 (vanilla 64), StaticShadows 256
#   (vanilla 48), ScriptSearchLights 32 (vanilla 8).
# - CLEO 4 runs CLEO scripts, which many gameplay mods are.
# - Mod Loader installs other mods from its modloader folder without
#   touching the game's files.
# - Proper Shaders (Junior_Djjr, MixMods) adds SMAA, bloom, sun rays and
#   soft particles on its lightest preset, or deferred lighting on the
#   others. Its licence doesn't allow reuploads, so download it from MixMods
#   ("SA - Proper Shaders") and give the zip to the recipe. It is installed
#   without Mod Loader: its plugin and ini in scripts, its resources folder
#   and .json files in the game folder, where it looks for them. The recipe
#   picks preset 0 with the PS2-style lit map (Map = 1); preset 0 as shipped
#   (Map = 0) crashed on the PC.
# The Ultimate ASI Loader loads them: it takes the place of vorbisFile.dll,
# which the game loads at start, and passes the real one's calls on to it
# under the name vorbisHooked.dll.
#
# Direct3D 9 goes through a DXVK build with two San Andreas fixes,
# 2.6.2-prospero1 from github.com/mpereiraesaa/dxvk (DXVK 2.6.2 plus two
# commits; Lutris doesn't know this version, so install with pw_install.py):
# - d3d9.asyncSmallReadback, which the recipe turns on in a dxvk.conf next to
#   gta_sa.exe. Proper Shaders reads the sky colour back from the GPU every
#   frame, and stock DXVK stops and waits for the GPU each time; with this
#   option that small read returns the previous frame's value instead.
# - Cheaper reference counting and shader-constant copies in 32-bit DXVK,
#   which San Andreas, a draw-call-heavy 32-bit game, spends a lot of its CPU
#   time on.
# On the console the two together took Proper Shaders' medium preset from
# 42.5 to 44 fps on the same drive.
#
# The intro movies play through DirectShow. Wine's own MPEG splitter needs
# GStreamer, which the console's Wine doesn't have, and without a working
# one the game waits on the first movie forever. LAV Filters are Windows
# DirectShow filters and play them on the console as they do Warcraft III's
# cinematics.
name: "Grand Theft Auto: San Andreas"
game_slug: gta-san-andreas
version: PC 1.0 (Prospero Win)
slug: gta-san-andreas-prospero-win
runner: wine
prospero:
  name: GTA San Andreas
  graphics: dxvk
  display: {desktop: 1920x1080, scaling: fit}
  input: {mode: xinput}
script:
  game:
    exe: drive_c/Games/GTASA/gta_sa.exe
    prefix: $GAMEDIR
  files:
  - game: "N/A:Select the folder of your installed GTA San Andreas 1.0 (it holds gta_sa.exe)"
  - framerate_vigilante: "N/A:Select Framerate_Vigilante.zip, downloaded from MixMods (the version from 2026-10-01 or later)"
  - proper_shaders: "N/A:Select the SA - Proper Shaders zip, downloaded from MixMods (the 08-26 build or later)"
  # Third-party mods: downloaded, not shipped, and pinned to the releases'
  # bytes.
  - asiloader:
      url: https://github.com/ThirteenAG/Ultimate-ASI-Loader/releases/download/v9.7.4/Ultimate-ASI-Loader.zip
      filename: Ultimate-ASI-Loader-v9.7.4.zip
      sha256: 952cebfc30d525afc2bdbaca954329d405ded3aa688a83027354dae14dfd5c5f
  - silentpatch:
      url: https://github.com/CookiePLMonster/SilentPatch/releases/download/1.1-BUILD34.1-SA/SilentPatchSA.zip
      filename: SilentPatchSA-1.1-BUILD34.1.zip
      sha256: 0837bbdc0548a4a952f924adefd2bb6eacc866407f153844fe1f56995668c42c
  # GInput 1.11 for San Andreas, from Silent's site (silentsblog.com).
  - ginput:
      url: https://silent.rockstarvision.com/uploads/GInputSA.zip
      filename: GInputSA-1.11.zip
      sha256: b6d03e3322c61eda3c582dda062f3547dd06b73c3ff8298ee4aaf0d81a9ec201
  # ThirteenAG publishes the Widescreen Fix as a rolling build under one tag:
  # when it changes, update the hash (the build pinned here is 2026-10-04's).
  - widescreenfix:
      url: https://github.com/ThirteenAG/WidescreenFixesPack/releases/download/gtasa/GTASA.WidescreenFix.zip
      filename: GTASA.WidescreenFix-20261004.zip
      sha256: 563078bfae5ad93be548d9378d4a97809762fb3a8dfdf0ef65e6023beadeb3ae
  - cleo:
      url: https://github.com/cleolibrary/CLEO4/releases/download/v4.4.4/CLEO4.zip
      filename: CLEO4-v4.4.4.zip
      sha256: aca8a1ca9dfc85d6f886b5963388059b2580501219f1f6b891114560552a8560
  - modloader:
      url: https://github.com/thelink2012/modloader/releases/download/v0.3.10/modloader.zip
      filename: modloader-v0.3.10.zip
      sha256: 3bb0e3d656a55d8c0a7ce98876033e2b9b672e8b7b5596f8044ccaa8f38dc403
  - widescreenfrontend:
      url: https://github.com/ThirteenAG/WidescreenFixesPack/releases/download/gtasa/GTASA.WidescreenFrontend.zip
      filename: GTASA.WidescreenFrontend-20190412.zip
      sha256: 341262df3eb5688e534d2022432aa753eddacc294b7d8aacf94e0facc3b843ae
  - limitadjuster:
      url: https://github.com/GTAmodding/III.VC.SA.LimitAdjuster/releases/download/v1.7.2/III.VC.SA.LimitAdjuster.zip
      filename: III.VC.SA.LimitAdjuster-v1.7.2.zip
      sha256: 4795a84d6b1a3c35715ba579d2bbe491daa69ffa17e1b8c350a9265d3190e1c6
  wine:
    dxvk: true
    dxvk_version: "2.6.2-prospero1"
  installer:
  - task: {name: create_prefix, prefix: $GAMEDIR, arch: win32}
  - copy: {src: game, dst: $GAMEDIR/drive_c/Games/GTASA}
  # The option the custom DXVK build adds (see above).
  - write_file:
      file: $GAMEDIR/drive_c/Games/GTASA/dxvk.conf
      content: "d3d9.asyncSmallReadback = True\n"
  - task: {name: winetricks, app: lavfilters, prefix: $GAMEDIR}
  # The ASI loader as vorbisFile.dll, the real one as vorbisHooked.dll.
  - move:
      src: $GAMEDIR/drive_c/Games/GTASA/vorbisFile.dll
      dst: $GAMEDIR/drive_c/Games/GTASA/vorbisHooked.dll
  - extract: {file: asiloader, dst: $CACHE/asiloader}
  - move:
      src: $CACHE/asiloader/dinput8.dll
      dst: $GAMEDIR/drive_c/Games/GTASA/vorbisFile.dll
  - extract: {file: silentpatch, dst: $CACHE/silentpatch}
  - copy: {src: $CACHE/silentpatch/SilentPatchSA.asi, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - copy: {src: $CACHE/silentpatch/SilentPatchSA.ini, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - extract: {file: ginput, dst: $CACHE/ginput}
  - copy: {src: $CACHE/ginput/GInputSA.asi, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - copy: {src: $CACHE/ginput/GInputSA.ini, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  # Its zip carries its own copy of the ASI loader; only the plugin is used.
  - extract: {file: widescreenfix, dst: $CACHE/widescreenfix}
  - copy: {src: $CACHE/widescreenfix/scripts, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - extract: {file: widescreenfrontend, dst: $GAMEDIR/drive_c/Games/GTASA}
  - extract: {file: limitadjuster, dst: $CACHE/limitadjuster}
  - copy: {src: $CACHE/limitadjuster/III.VC.SA.LimitAdjuster.asi, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - copy: {src: $CACHE/limitadjuster/III.VC.SA.LimitAdjuster.ini, dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - extract: {file: framerate_vigilante, dst: $CACHE/framerate_vigilante}
  - copy: {src: "$CACHE/framerate_vigilante/GTA SA/FramerateVigilante", dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  # Only those three lines change; the rest of the ini keeps its comments.
  - execute:
      command: >-
        sed -i -e '/^\[SALIMITS\]/,/^\[/{s/^Coronas = [0-9]*/Coronas = 1000/;s/^StaticShadows = [0-9]*/StaticShadows = 256/;s/^ScriptSearchLights = [0-9]*/ScriptSearchLights = 32/}'
        "$GAMEDIR/drive_c/Games/GTASA/scripts/III.VC.SA.LimitAdjuster.ini"
  # CLEO: CLEO.asi, bass.dll and the cleo folder in the game folder.
  - extract: {file: cleo, dst: $CACHE/cleo}
  - copy: {src: $CACHE/cleo/CLEO.asi, dst: $GAMEDIR/drive_c/Games/GTASA}
  - copy: {src: $CACHE/cleo/bass.dll, dst: $GAMEDIR/drive_c/Games/GTASA}
  - copy: {src: $CACHE/cleo/cleo, dst: $GAMEDIR/drive_c/Games/GTASA/cleo}
  # Mod Loader: modloader.asi and its modloader folder in the game folder.
  - extract: {file: modloader, dst: $GAMEDIR/drive_c/Games/GTASA}
  - execute:
      command: rm -f "$GAMEDIR/drive_c/Games/GTASA/Readme.txt" "$GAMEDIR/drive_c/Games/GTASA/Leia-me.txt"
  # Proper Shaders without Mod Loader (see above).
  - extract: {file: proper_shaders, dst: $CACHE/proper_shaders}
  - copy: {src: "$CACHE/proper_shaders/Proper Shaders/ProperShaders.asi", dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - copy: {src: "$CACHE/proper_shaders/(presets)/(0- only improvements)/ProperShaders.ini", dst: $GAMEDIR/drive_c/Games/GTASA/scripts}
  - copy: {src: "$CACHE/proper_shaders/Proper Shaders/resources", dst: $GAMEDIR/drive_c/Games/GTASA/resources}
  - copy: {src: "$CACHE/proper_shaders/Proper Shaders/MaterialsData.json", dst: $GAMEDIR/drive_c/Games/GTASA}
  - copy: {src: "$CACHE/proper_shaders/Proper Shaders/MapTweaks.json", dst: $GAMEDIR/drive_c/Games/GTASA}
  - copy: {src: "$CACHE/proper_shaders/Proper Shaders/SoftParticlesSettings.json", dst: $GAMEDIR/drive_c/Games/GTASA}
  - execute:
      command: >-
        sed -i -e 's/^Map = 0 /Map = 1 /' "$GAMEDIR/drive_c/Games/GTASA/scripts/ProperShaders.ini"
  # The button pictures GInput shows in the game's help boxes.
  - copy: {src: $CACHE/ginput/models, dst: $GAMEDIR/drive_c/Games/GTASA/models}
  # PlayStation button prompts (Cross, Circle...) instead of Xbox ones.
  - write_config:
      file: $GAMEDIR/drive_c/Games/GTASA/scripts/GInputSA.ini
      section: GInput
      key: PlayStationButtons
      value: 1
